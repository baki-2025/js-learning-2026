<!DOCTYPE html>
<html>
<body>
<h1>JavaScript WeakSet</h1>

<p id="demo"></p>

<script>
// Create a WeakSet
let mySet = new WeakSet();

// Create an Object
let myObj = {fname:"John", lname:"Doe"};

// Add the Object
mySet.add(myObj);

// Delete the Object
mySet.delete(myObj);

// Do I have myObj in the mySet?
let answer = mySet.has(myObj);

document.getElementById("demo").innerHTML = "Do I have myObj? is " + answer
</script>

</body>
</html>
